<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101820">
  <title>WIS | State 625 Application</title>
  <style>
    :root {
      --bg: #0b1117; --panel: #121c25; --panel2: #17232e;
      --line: #2a3946; --text: #edf2f4; --muted: #9aaab5;
      --gold: #c6a66b; --gold2: #e0c58e; --red: #a94f45;
      --input: #0d151d; --green: #789b83;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background: radial-gradient(ellipse at 50% -20%, #263747 0%, transparent 55%), var(--bg);
      font: 15px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .topline { height: 4px; background: linear-gradient(90deg, #596b75, var(--gold), #596b75); }
    .wrap { width: min(1100px, calc(100% - 30px)); margin: 24px auto 60px; }
    header { text-align: center; margin-bottom: 26px; }
    .crest {
      width: 66px; height: 66px; margin: 0 auto 12px; display:grid; place-items:center;
      border: 1px solid #806b47; color: var(--gold2); background: #18232c;
      clip-path: polygon(50% 0, 92% 15%, 88% 72%, 50% 100%, 12% 72%, 8% 15%);
      font-weight: 900; letter-spacing: 2px; font-size: 20px;
    }
    .eyebrow { color: var(--gold); font-size: 11px; font-weight: 800; letter-spacing: .24em; }
    h1 { margin: 7px 0 3px; font-size: clamp(30px, 6vw, 46px); letter-spacing: .12em; line-height: 1.1; }
    .subtitle { color: var(--muted); margin: 8px 0 0; }
    .status { display:inline-flex; align-items:center; gap:8px; margin-top:16px; padding:6px 11px; border:1px solid #34434d; border-radius:30px; color:#c5d0d5; font-size:11px; letter-spacing:.12em; }
    .dot { width:7px; height:7px; background:var(--green); border-radius:50%; box-shadow:0 0 10px #789b83; }
    form { background: linear-gradient(180deg, rgba(23,35,46,.97), rgba(16,25,34,.98)); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:0 24px 70px #0007; }
    .intro { padding:20px 24px; border-bottom:1px solid var(--line); color:#bdc8ce; font-size:13px; }
    .section { padding:23px 24px 25px; border-bottom:1px solid var(--line); }
    .section:last-of-type { border-bottom:0; }
    .section-title { display:flex; align-items:center; gap:11px; margin:0 0 18px; color:var(--gold2); font-size:12px; letter-spacing:.16em; font-weight:850; }
    .num { display:grid; place-items:center; width:25px; height:25px; border:1px solid #705d3f; border-radius:6px; color:var(--gold); font-size:11px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .field { display:flex; flex-direction:column; gap:7px; min-width:0; }
    .field.full { grid-column:1/-1; }
    label { color:#d7e0e4; font-size:12px; font-weight:700; }
    .hint { color:var(--muted); font-size:11px; font-weight:400; }
    input, select, textarea {
      width:100%; min-height:44px; border:1px solid #34434f; border-radius:7px;
      padding:11px 12px; color:var(--text); background:var(--input); font:inherit; outline:none;
    }
    input:focus, select:focus, textarea:focus { border-color:var(--gold); box-shadow:0 0 0 3px #c6a66b22; }
    input::placeholder, textarea::placeholder { color:#667783; }
    select { color-scheme:dark; }
    textarea { min-height:112px; resize:vertical; }
    input[type=file] { padding:9px; font-size:12px; }
    input[type=file]::file-selector-button { background:#263744; color:#e5edf0; border:1px solid #435462; padding:7px 10px; border-radius:5px; margin-right:10px; }
    .checkrow { display:flex; align-items:flex-start; gap:10px; margin-top:18px; color:#b9c6cc; font-size:12px; }
    .checkrow input { width:16px; min-height:16px; margin-top:2px; accent-color:var(--gold); }
    .actions { padding:22px 24px 25px; background:#0e171f; }
    button { width:100%; border:1px solid #d1b47d; border-radius:7px; padding:14px 18px; color:#171b1e; background:linear-gradient(180deg,#dfc58f,#b99a5f); font-weight:900; letter-spacing:.15em; cursor:pointer; }
    button:hover { filter:brightness(1.08); }
    button:disabled { opacity:.6; cursor:wait; }
    .notice { display:none; margin-top:14px; padding:12px 14px; border-radius:7px; font-size:13px; }
    .notice.error { display:block; color:#ffd9d5; border:1px solid #8f4a43; background:#49252255; }
    .notice.success { display:block; color:#d7f0df; border:1px solid #557d61; background:#203b2a88; }
    footer { text-align:center; margin-top:20px; color:#71818c; font-size:11px; letter-spacing:.06em; }
    .required { color:var(--gold2); }
    @media(max-width:620px) {
      .wrap { margin-top:25px; }
      .section, .intro, .actions { padding-left:17px; padding-right:17px; }
      .grid { grid-template-columns:1fr; gap:13px; }
      .field.full { grid-column:auto; }
    }
  
    body.landing-mode {
      min-height:100svh;
      height:100svh;
      overflow:hidden;
      background:#090b17;
    }
    body.landing-mode .topline { display:none; }
    body.landing-mode .wrap {
      width:100%;
      max-width:none;
      height:100svh;
      min-height:100svh;
      margin:0;
      padding:0;
    }
    #landing {
      position:relative;
      width:100%;
      height:100svh;
      min-height:100svh;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      isolation:isolate;
      background:#090b17;
    }
    .landing-backdrop {
      position:absolute;
      z-index:-1;
      inset:-28px;
      background-image:url('wis-landing-duck.png');
      background-size:cover;
      background-position:center;
      filter:blur(20px) brightness(.48) saturate(.9);
      transform:scale(1.08);
    }
    .landing-poster {
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .landing-poster img {
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center center;
    }
    .landing-apply {
      position:absolute;
      z-index:5;
      left:50%;
      bottom:calc(22px + env(safe-area-inset-bottom));
      transform:translateX(-50%);
      width:min(82%,560px);
      min-height:68px;
      padding:16px 22px;
      border:2px solid #e7c77e;
      border-radius:14px;
      background:linear-gradient(180deg,rgba(244,216,155,.98),rgba(184,132,57,.98));
      color:#24162f;
      font-size:clamp(17px,3.5vw,25px);
      font-weight:900;
      letter-spacing:.12em;
      text-shadow:0 1px 0 rgba(255,255,255,.25);
      box-shadow:0 8px 26px rgba(12,7,22,.55), inset 0 1px 0 rgba(255,255,255,.45);
      cursor:pointer;
    }
    .landing-apply:active { transform:translateX(-50%) scale(.985); }
    @media (min-width:700px) {
      .landing-apply { bottom:28px; }
    }
    [hidden] { display:none !important; }
  

    .application-panel {
      background: linear-gradient(180deg, rgba(23,35,46,.97), rgba(16,25,34,.98));
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 24px 70px #0007;
    }
    .tally-frame {
      width: 100%;
      min-height: 720px;
      background: transparent;
      overflow: hidden;
    }
    .tally-frame iframe {
      display: block;
      width: 100%;
      min-height: 720px;
      border: 0;
      background: transparent;
    }
    @media (max-width: 600px) {
      .tally-frame, .tally-frame iframe { min-height: 900px; }
    }
  
    .landing-art {
      display: block;
      width: 100%;
      height: 100%;
    }
    .landing-art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }
\n  </style>

    const languageSelect = document.getElementById('languageSelect');
    function applyLanguage() {
      const raw = languageSelect.value;
      const key = raw.startsWith('zh-') ? 'zh' : raw;
      const dict = translations[key] || translations.en;
      document.documentElement.lang = raw;
      document.documentElement.dir = raw === 'ar' ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.dataset.i18n;
        if (dict[k]) {
          if (el.tagName === 'LABEL' && el.querySelector('.required')) {
            const star = el.querySelector('.required').outerHTML;
            el.innerHTML = dict[k].replace(' *', '') + ' ' + star;
          } else el.textContent = dict[k];
        }
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const k = el.dataset.i18nPlaceholder;
        if (dict[k]) el.placeholder = dict[k];
      });
      document.querySelectorAll('[data-i18n-option]').forEach(el => {
        const k = el.dataset.i18nOption;
        if (dict[k]) el.textContent = dict[k];
